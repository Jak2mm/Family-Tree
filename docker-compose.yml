# Settings come from the file named ".env" next to this one (copy .env.example to .env).
services:
  app:
    build: .
    image: family-tree:latest
    container_name: family-tree
    restart: unless-stopped
    init: true
    # Which user the app runs as. Match this to the owner of the photos folder on the NAS (see README).
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      # Only this VM by default. "tailscale serve" (README, step 4) shares it with your other devices.
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8000"
    environment:
      FAMILY_TREE_TIMEZONE: "${TIMEZONE:-Australia/Sydney}"
      FAMILY_TREE_COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      FAMILY_TREE_PHOTOS_DIR: /nas/photos
      FAMILY_TREE_BACKUPS_DIR: /nas/backups
      # While this file is missing the app treats the NAS as offline (see README, step 2c). It checks
      # on every upload and backup, so it recovers by itself when the NAS comes back.
      FAMILY_TREE_NAS_MARKER: /nas/.family-tree-nas-ok
    volumes:
      # The database lives on the VM's own disk (a Docker volume), never on the NAS.
      - family_tree_data:/data
      # The NAS share (photos and backups folders). With a plain "nofail" fstab mount (README, step 2b) the
      # mount folder exists even when the NAS is off, so the app still starts; "rslave" lets a share
      # mounted later appear inside the app. Do NOT use x-systemd.automount for this folder.
      - type: bind
        source: "${NAS_MOUNT:?Set NAS_MOUNT in the .env file}"
        target: /nas
        bind:
          create_host_path: false
          propagation: rslave
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  family_tree_data:
